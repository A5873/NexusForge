<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and patterns -->
  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Main gradient: Deep blue to vibrant purple -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A5E"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    
    <!-- Accent gradient: Cyan to purple -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>
    
    <!-- 3D effect gradient -->
    <linearGradient id="dimensionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0CA3"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
  </defs>
  
  <!-- Left side: Forge symbol -->
  <g id="forgeFrame" transform="translate(120, 100)">
    <!-- Outer hexagon -->
    <path d="M86.6,50 L86.6,-50 L0,-100 L-86.6,-50 L-86.6,50 L0,100 Z" 
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="6"
          stroke-linejoin="round"/>
    
    <!-- Inner hexagon (slightly smaller) -->
    <path d="M69.3,40 L69.3,-40 L0,-80 L-69.3,-40 L-69.3,40 L0,80 Z" 
          fill="none" 
          stroke="url(#accentGradient)" 
          stroke-width="2"
          stroke-dasharray="4 2"
          stroke-linejoin="round"/>
    
    <!-- 2D to 3D transformation elements -->
    <g id="dimensionTransform">
      <!-- 2D square -->
      <rect x="-40" y="-40" width="30" height="30" 
            fill="#4361EE" 
            opacity="0.7"
            transform="rotate(-15)"/>
      
      <!-- Transitioning shape -->
      <path d="M0,-30 L30,-15 L30,15 L0,30 L-30,15 L-30,-15 Z" 
            fill="#4CC9F0" 
            opacity="0.8"/>
      
      <!-- 3D cube wireframe -->
      <g transform="translate(15, 0) rotate(15)">
        <!-- Front face -->
        <path d="M-20,-20 L20,-20 L20,20 L-20,20 Z" 
              fill="none" 
              stroke="url(#dimensionGradient)" 
              stroke-width="2"/>
        
        <!-- Back face -->
        <path d="M-10,-30 L30,-30 L30,10 L-10,10 Z" 
              fill="none" 
              stroke="url(#dimensionGradient)" 
              stroke-width="2"/>
        
        <!-- Connecting lines -->
        <path d="M-20,-20 L-10,-30 M20,-20 L30,-30 M20,20 L30,10 M-20,20 L-10,10" 
              stroke="url(#dimensionGradient)" 
              stroke-width="2"/>
      </g>
      
      <!-- Small building blocks (suggesting crafting) -->
      <circle cx="-20" cy="10" r="5" fill="#7209B7" opacity="0.9"/>
      <circle cx="25" cy="-15" r="4" fill="#F72585" opacity="0.9"/>
      <circle cx="0" cy="25" r="6" fill="#3A0CA3" opacity="0.9"/>
      
      <!-- Connection lines (suggesting nexus) -->
      <path d="M-20,10 L0,25 L25,-15" 
            stroke="url(#accentGradient)" 
            stroke-width="1.5"
            stroke-dasharray="3 2"
            fill="none"/>
    </g>
  </g>
  
  <!-- Right side: Typography -->
  <g id="logoType" transform="translate(250, 100)">
    <!-- NexusForge text -->
    <text font-family="Arial, Helvetica, sans-serif" 
          font-weight="700" 
          font-size="48" 
          letter-spacing="1.2"
          text-anchor="start"
          x="0"
          fill="url(#mainGradient)"
          filter="url(#glow)">
      NexusForge
    </text>
    
    <!-- Tagline -->
    <text font-family="Arial, Helvetica, sans-serif" 
          font-weight="500" 
          font-size="16" 
          letter-spacing="0.8"
          text-anchor="start"
          x="0"
          y="35"
          fill="#1A1A3A">
      Where Dimensions Unite, Games Take Flight
    </text>
  </g>
</svg>

